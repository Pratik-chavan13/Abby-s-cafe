<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Abby's Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #fcfcfc; }
  </style>
</head>
<body class="text-on-surface">

  <!-- Login Section -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center bg-surface-container-low px-4 hidden">
    <div class="bg-white p-8 rounded-2xl shadow-sm w-full max-w-md border border-outline-variant/20">
      <div class="text-center mb-8">
        <h1 class="text-headline-sm font-headline-sm text-primary mb-2">Abby's Admin</h1>
        <p class="text-body-md text-on-surface-variant">Sign in to manage orders</p>
      </div>
      <form id="loginForm" class="flex flex-col gap-4">
        <div>
          <label class="block text-label-md text-secondary mb-1">Email</label>
          <input type="email" id="emailInput" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none" required>
        </div>
        <div>
          <label class="block text-label-md text-secondary mb-1">Password</label>
          <input type="password" id="passwordInput" class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none" required>
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-espresso text-white py-3 rounded-xl font-medium transition-colors mt-2">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="min-h-screen flex flex-col hidden">
    <!-- Header -->
    <header class="bg-white border-b border-outline-variant/20 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-4">
        <h1 class="text-title-lg font-headline-sm text-primary">Live Orders</h1>
        <div class="flex items-center gap-2 px-3 py-1 bg-green-50 text-green-700 rounded-full text-label-sm border border-green-200">
          <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
          Realtime Connected
        </div>
      </div>
      <button onclick="handleLogout()" class="text-secondary hover:text-primary transition-colors flex items-center gap-2 text-label-md">
        <span class="material-symbols-outlined text-[20px]">logout</span> Sign Out
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-7xl w-full mx-auto">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar stats -->
        <div class="lg:col-span-1 flex flex-col gap-4">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-outline-variant/20">
            <span class="text-label-md text-secondary uppercase tracking-wider">Today's Orders</span>
            <div class="text-display-sm text-primary font-headline-lg mt-2" id="statTodayCount">0</div>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-outline-variant/20">
            <span class="text-label-md text-secondary uppercase tracking-wider">Pending</span>
            <div class="text-display-sm text-olive-accent font-headline-lg mt-2" id="statPendingCount">0</div>
          </div>
        </div>

        <!-- Orders List -->
        <div class="lg:col-span-3">
          <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/20 overflow-hidden">
            <div class="p-6 border-b border-outline-variant/20 flex justify-between items-center bg-surface-container-low/50">
              <h2 class="text-title-md font-medium text-primary">Order Queue</h2>
            </div>
            
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-outline-variant/20 bg-surface-container-low text-label-md text-secondary">
                    <th class="p-4 font-medium">Time</th>
                    <th class="p-4 font-medium">Customer</th>
                    <th class="p-4 font-medium">Items</th>
                    <th class="p-4 font-medium">Total</th>
                    <th class="p-4 font-medium">Status</th>
                    <th class="p-4 font-medium text-right">Action</th>
                  </tr>
                </thead>
                <tbody id="ordersTableBody" class="divide-y divide-outline-variant/10 text-body-md">
                  <!-- Orders rendered here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script src="/js/admin.js"></script>
</body>
</html>
